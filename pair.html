<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>𝐊𝐲𝐳𝐞𝐫-𝐌𝐃 Pair</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0 }
    body {
      font-family:'Poppins',sans-serif;
      background: radial-gradient(circle at center, #000000 0%, #111111 100%);
      color:#ffffff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:20px;
      animation:fadeIn 2s ease;
    }
    @keyframes fadeIn {
      0% { opacity:0; transform:scale(0.98); }
      100% { opacity:1; transform:scale(1); }
    }
    .particles span {
      position:absolute;
      display:block;
      width:12px;
      height:12px;
      background:radial-gradient(circle,#00FF00,#444);
      border-radius:50%;
      opacity:0.5;
      animation:float 6s linear infinite;
    }
    @keyframes float {
      0% { transform:translateY(100vh) scale(0.6); opacity:0; }
      30% { opacity:1; }
      100% { transform:translateY(-10vh) scale(1.2); opacity:0; }
    }
    .wrap { position:relative; z-index:2; width:400px; max-width:95%; }
    .box {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(0,255,0,0.2);
      border-radius:16px;
      padding:30px;
      backdrop-filter:blur(10px);
      box-shadow:0 0 30px rgba(0,255,0,0.1);
    }
    .logo {
      text-align:center;
      margin-bottom:20px;
    }
    .logo img {
      width:80px;
      height:80px;
      border-radius:50%;
      border:2px solid #00FF00;
    }
    h1 {
      text-align:center;
      font-size:1.4rem;
      margin-bottom:5px;
      color:#00FF00;
    }
    .subtitle {
      text-align:center;
      font-size:0.8rem;
      color:#888;
      margin-bottom:25px;
    }
    .form-group {
      margin-bottom:15px;
    }
    label {
      display:block;
      margin-bottom:6px;
      font-size:0.85rem;
      color:#ccc;
    }
    input {
      width:100%;
      padding:12px 15px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(0,255,0,0.3);
      border-radius:8px;
      color:#fff;
      font-size:0.95rem;
      outline:none;
      transition:border-color 0.3s;
    }
    input:focus {
      border-color:#00FF00;
      box-shadow:0 0 10px rgba(0,255,0,0.2);
    }
    input::placeholder { color:#555; }
    button {
      width:100%;
      padding:13px;
      background:linear-gradient(135deg,#00c900,#007700);
      border:none;
      border-radius:8px;
      color:#fff;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:all 0.3s;
      margin-top:5px;
    }
    button:hover {
      background:linear-gradient(135deg,#00ff00,#00aa00);
      transform:translateY(-2px);
      box-shadow:0 5px 20px rgba(0,255,0,0.3);
    }
    button:disabled {
      opacity:0.6;
      cursor:not-allowed;
      transform:none;
    }
    #result {
      margin-top:20px;
      padding:15px;
      border-radius:8px;
      display:none;
      text-align:center;
    }
    #result.success {
      background:rgba(0,255,0,0.1);
      border:1px solid rgba(0,255,0,0.3);
      color:#00FF00;
    }
    #result.error {
      background:rgba(255,0,0,0.1);
      border:1px solid rgba(255,0,0,0.3);
      color:#ff4444;
    }
    .code-box {
      font-size:2rem;
      font-weight:700;
      letter-spacing:8px;
      color:#00FF00;
      margin:10px 0;
      font-family:monospace;
    }
    .copy-btn {
      background:rgba(0,255,0,0.15);
      border:1px solid rgba(0,255,0,0.4);
      padding:8px 16px;
      border-radius:6px;
      font-size:0.8rem;
      cursor:pointer;
      color:#00FF00;
      margin-top:8px;
      width:auto;
      display:inline-block;
    }
    .info-text {
      font-size:0.75rem;
      color:#888;
      margin-top:8px;
      line-height:1.5;
    }
    .loading {
      display:inline-block;
      width:20px;
      height:20px;
      border:2px solid rgba(255,255,255,0.3);
      border-top-color:#00FF00;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      vertical-align:middle;
      margin-right:8px;
    }
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    .footer-text {
      text-align:center;
      font-size:0.7rem;
      color:#444;
      margin-top:20px;
    }
  </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="wrap">
  <div class="box">
    <div class="logo">
      <img src="https://files.catbox.moe/ut2xyq.png" alt="KyzerMD" onerror="this.style.display='none'">
    </div>
    <h1>𝐊𝐲𝐳𝐞𝐫-𝐌𝐃 4.0.0V 🥷</h1>
    <p class="subtitle">WhatsApp Bot Pairing — Enter your number below</p>

    <div class="form-group">
      <label for="phoneInput">📱 WhatsApp Number (with country code)</label>
      <input
        type="tel"
        id="phoneInput"
        placeholder="e.g. 94704290562"
        maxlength="20"
      />
    </div>

    <button id="pairBtn" onclick="getPairCode()">
      🔗 Get Pair Code
    </button>

    <div id="result"></div>

    <p class="footer-text">〠 Powered By 𝐊𝐲𝐳𝐞𝐫-𝐌𝐃 V.4 🥷🇱🇰</p>
  </div>
</div>

<script>
  // Particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const span = document.createElement('span');
    span.style.left = Math.random() * 100 + 'vw';
    span.style.animationDelay = Math.random() * 6 + 's';
    span.style.animationDuration = (4 + Math.random() * 4) + 's';
    span.style.width = span.style.height = (6 + Math.random() * 8) + 'px';
    container.appendChild(span);
  }

  async function getPairCode() {
    const input = document.getElementById('phoneInput').value.trim().replace(/\D/g, '');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('pairBtn');

    if (!input || input.length < 7) {
      resultDiv.className = 'error';
      resultDiv.innerHTML = '❌ Please enter a valid phone number.';
      resultDiv.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> Generating...';
    resultDiv.style.display = 'none';

    try {
      const resp = await fetch('/code?number=' + encodeURIComponent(input));
      const data = await resp.json();

      if (data.code) {
        resultDiv.className = 'success';
        resultDiv.innerHTML = `
          <div>✅ <strong>Pair Code Generated!</strong></div>
          <div class="code-box">${data.code}</div>
          <button class="copy-btn" onclick="copyCode('${data.code}')">📋 Copy Code</button>
          <p class="info-text">
            1. Open WhatsApp → Linked Devices<br>
            2. Tap "Link a Device"<br>
            3. Enter the code above<br>
            ⏳ Code expires in 60 seconds
          </p>
        `;
        resultDiv.style.display = 'block';
      } else if (data.status === 'already_connected') {
        resultDiv.className = 'success';
        resultDiv.innerHTML = '✅ This number is already connected!';
        resultDiv.style.display = 'block';
      } else {
        throw new Error(data.error || 'Failed to get pair code');
      }
    } catch (e) {
      resultDiv.className = 'error';
      resultDiv.innerHTML = '❌ Error: ' + (e.message || 'Could not connect to server');
      resultDiv.style.display = 'block';
    }

    btn.disabled = false;
    btn.innerHTML = '🔗 Get Pair Code';
  }

  function copyCode(code) {
    navigator.clipboard.writeText(code).then(() => {
      alert('✅ Code copied: ' + code);
    }).catch(() => {
      prompt('Copy this code:', code);
    });
  }

  document.getElementById('phoneInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') getPairCode();
  });
</script>
</body>
</html>
